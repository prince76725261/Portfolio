<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume — Prince Kumar Singh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <style>
    .resume-shell { padding-top: calc(var(--nav-h) + 40px); padding-bottom: 80px; }
    .resume-bar {
      display: flex; flex-wrap: wrap; gap: 12px;
      align-items: center; justify-content: space-between;
      margin-bottom: 26px;
    }
    .viewer {
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .viewer object, .viewer iframe { width: 100%; height: 82vh; min-height: 520px; border: 0; display: block; }
    .fallback { padding: 40px 24px; text-align: center; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="mesh" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="nav stuck">
    <div class="wrap">
      <a class="brand" href="../index.html"><span class="brand-mark">PS</span> Prince Singh</a>
      <div class="nav-actions">
        <button class="icon-btn theme-toggle" type="button" aria-label="Toggle colour theme">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap resume-shell">
    <div class="resume-bar">
      <div>
        <span class="eyebrow">Resume</span>
        <h1 style="font-size:clamp(28px,4.4vw,40px)">Prince Kumar Singh</h1>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn btn-ghost" href="../index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          Back
        </a>
        <a class="btn btn-primary" href="NIT JAMSHEDPUR_PRINCE KUMAR SINGH.pdf" download>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
          Download PDF
        </a>
      </div>
    </div>

    <div class="viewer">
      <object data="NIT JAMSHEDPUR_PRINCE KUMAR SINGH.pdf" type="application/pdf">
        <iframe src="NIT JAMSHEDPUR_PRINCE KUMAR SINGH.pdf" title="Resume PDF"></iframe>
        <div class="fallback">
          <p>Your browser can't display the PDF inline.</p>
          <p style="margin-top:14px"><a class="btn btn-primary" href="NIT JAMSHEDPUR_PRINCE KUMAR SINGH.pdf">Open the resume</a></p>
        </div>
      </object>
    </div>
  </main>

  <script src="../assets/main.js"></script>
</body>
</html>
